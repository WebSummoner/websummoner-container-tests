# Dependency updates via GitHub Dependabot.
# Weekly cadence keeps the manual CVE sweeps unnecessary; pull requests are
# grouped so a repository gets one reviewable bump per ecosystem.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    groups:
      maven-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
