org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.logFile=System.err

# Browsers phone home during the proxy test; the proxy prints a stack trace for
# every connection it cuts off at shutdown.
org.slf4j.simpleLogger.log.org.littleshoot.proxy=warn
org.slf4j.simpleLogger.log.com.browserup=warn
